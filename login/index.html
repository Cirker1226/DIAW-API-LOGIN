<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="conteudo">
    <section class="painel">
        <img id="logo" src="../site/img/logo.png" alt="logo">
        <form class="formulario">
            <div class="inputs">
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" placeholder="Digite seu usuario">
            </div>
            <div class="inputs">
                <label for="password">Senha:</label>
                <input type="text" id="password" placeholder="Digite sua senha">
            </div>
            <div class="confirmar">
                <button id="btn-confirm" type="submit">Logar</button>
                <p id="btn-text">Ainda não possui conta?<a href="#"> Cadastre-se</a></p>
            </div>
        </form>
    </section>
</body>
</html>
